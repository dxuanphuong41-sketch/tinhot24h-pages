  <style>
    body {
      margin: 0;

      background: linear-gradient(135deg, #09152c, #163d8f);

      width: min(700px, calc(100% - 32px));

<body>
  <div class="panel">
    <h1>TikTok OAuth Callback</h1>
    <p>Trang này dùng để nhận phản hồi đăng nhập TikTok cho ứng dụng <strong>tinhot24h</strong>.</p>
    <p>Nếu bạn thấy mã <code>code</code> hoặc <code>state</code> trên URL, điều đó có nghĩa là TikTok đã redirect thành công.</p>
    <pre id="debug">Dang cho du lieu callback...</pre>
  </div>
  <script>
    const debug = document.getElementById("debug");
    const params = new URLSearchParams(window.location.search);
    const entries = [...params.entries()];
    debug.textContent = entries.length
      ? entries.map(([k, v]) => `${k}: ${v}`).join("\n")
      : "Khong co query param nao tren URL.";
  </script>
